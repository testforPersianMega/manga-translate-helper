<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manga Bubble Translator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --border: #d6dae3;
        --accent: #3b82f6;
        --accent-soft: rgba(59, 130, 246, 0.2);
        --text: #1f2937;
        --muted: #6b7280;
        --error: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      header h1 {
        margin: 0;
        font-size: 20px;
      }

      .status {
        font-size: 14px;
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .toolbar input[type="file"] {
        display: none;
      }

      .toolbar button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }

      .toolbar button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      main {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 320px;
        gap: 16px;
        padding: 16px 24px 24px;
        min-height: calc(100vh - 88px);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        overflow: hidden;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .bubble-list {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .page-list {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .page-list button {
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        font-size: 14px;
      }

      .page-list button.active {
        background: var(--accent-soft);
        font-weight: 600;
      }

      .page-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .page-meta span {
        background: #eef2ff;
        color: #4338ca;
        padding: 2px 6px;
        border-radius: 999px;
      }

      .bubble-list button {
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        font-size: 14px;
      }

      .bubble-list button.active {
        background: var(--accent-soft);
        font-weight: 600;
      }

      .image-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .image-wrapper {
        position: relative;
        background: #111827;
        border-radius: 12px;
        overflow: hidden;
        flex: 1;
        min-height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-wrapper.grabbable {
        cursor: grab;
      }

      .image-wrapper.grabbing {
        cursor: grabbing;
      }

      .image-toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 8px;
        padding: 8px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.4);
        backdrop-filter: blur(6px);
        z-index: 3;
      }

      .image-toolbar button {
        border: 1px solid rgba(148, 163, 184, 0.6);
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .image-toolbar button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .zoom-label {
        display: inline-flex;
        align-items: center;
        padding: 0 8px;
        font-size: 12px;
        color: #e2e8f0;
        border-radius: 8px;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.4);
      }

      .image-stage {
        position: relative;
        display: inline-flex;
        transform-origin: center;
        transition: transform 0.15s ease;
      }

      .image-wrapper img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      .overlay-layer {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      .bubble-overlay {
        position: absolute;
        border: 2px solid rgba(255, 255, 255, 0.7);
        background: rgba(59, 130, 246, 0.12);
        border-radius: 6px;
        pointer-events: auto;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          background 0.2s ease;
      }

      .bubble-overlay.active {
        border-color: var(--accent);
        background: rgba(59, 130, 246, 0.28);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }

      .right-panel h2 {
        margin-top: 0;
        font-size: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field label {
        font-size: 13px;
        color: var(--muted);
      }

      .field input,
      .field textarea,
      .field select {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 14px;
        font-family: inherit;
      }

      .field textarea {
        min-height: 120px;
        resize: vertical;
      }

      .placeholder {
        color: var(--muted);
        font-size: 14px;
      }

      .error {
        color: var(--error);
        font-size: 14px;
      }

      @media (max-width: 1100px) {
        main {
          grid-template-columns: 180px minmax(0, 1fr) 280px;
        }
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }

        .left-panel,
        .right-panel {
          order: 2;
        }

        .image-panel {
          order: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Manga Bubble Translator</h1>
        <div class="status" id="statusText">No image or JSON loaded.</div>
      </div>
      <div class="toolbar">
        <label>
          Upload Images
          <input
            type="file"
            id="imageInput"
            accept="image/png, image/jpeg"
            multiple
          />
        </label>
        <label>
          Upload JSONs
          <input
            type="file"
            id="jsonInput"
            accept="application/json"
            multiple
          />
        </label>
        <button id="downloadBtn" disabled>Download JSON</button>
        <button id="downloadAllBtn" disabled>Download All JSONs</button>
      </div>
    </header>

    <main>
      <section class="panel left-panel">
        <strong>Pages</strong>
        <div class="page-list" id="pageList"></div>
        <strong>Bubble List</strong>
        <div class="bubble-list" id="bubbleList"></div>
      </section>

      <section class="image-panel">
        <div class="panel image-wrapper" id="imageWrapper">
          <div class="image-toolbar" aria-label="Image tools">
            <button type="button" id="zoomOutBtn" title="Zoom out">-</button>
            <button type="button" id="zoomInBtn" title="Zoom in">+</button>
            <button type="button" id="zoomResetBtn" title="Reset zoom">
              Reset
            </button>
            <span class="zoom-label" id="zoomLabel">100%</span>
          </div>
          <div class="placeholder" id="imagePlaceholder">
            Upload an image to begin.
          </div>
          <div class="image-stage" id="imageStage">
            <img
              id="mainImage"
              onselectstart="return false;"
              draggable="false"
              alt="Uploaded preview"
            />
            <div class="overlay-layer" id="overlayLayer"></div>
          </div>
        </div>
        <div class="error" id="errorText"></div>
      </section>

      <section class="panel right-panel">
        <h2>Bubble Details</h2>
        <div id="detailPlaceholder" class="placeholder">
          Select a bubble to edit its translation.
        </div>
        <div id="detailForm" hidden>
          <div class="field">
            <label>Bubble ID</label>
            <input id="bubbleId" type="text" readonly />
          </div>
          <div class="field">
            <label>Original Text</label>
            <textarea id="bubbleOriginal" readonly></textarea>
          </div>
          <div class="field">
            <label>Translated Text</label>
            <textarea id="bubbleText"></textarea>
          </div>
          <div class="field">
            <label>Bubble Type</label>
            <select id="bubbleType">
              <option>Standard</option>
              <option>Thought</option>
              <option>Shouting</option>
              <option>Whisper/Soft</option>
              <option>Narration</option>
              <option>Distorted/Custom</option>
              <option>SFX</option>
            </select>
          </div>
        </div>
      </section>
    </main>

    <script>
      const imageInput = document.getElementById("imageInput");
      const jsonInput = document.getElementById("jsonInput");
      const downloadBtn = document.getElementById("downloadBtn");
      const downloadAllBtn = document.getElementById("downloadAllBtn");
      const statusText = document.getElementById("statusText");
      const errorText = document.getElementById("errorText");
      const mainImage = document.getElementById("mainImage");
      const imageWrapper = document.getElementById("imageWrapper");
      const imagePlaceholder = document.getElementById("imagePlaceholder");
      const imageStage = document.getElementById("imageStage");
      const overlayLayer = document.getElementById("overlayLayer");
      const pageList = document.getElementById("pageList");
      const bubbleList = document.getElementById("bubbleList");
      const detailPlaceholder = document.getElementById("detailPlaceholder");
      const detailForm = document.getElementById("detailForm");
      const bubbleId = document.getElementById("bubbleId");
      const bubbleOriginal = document.getElementById("bubbleOriginal");
      const bubbleText = document.getElementById("bubbleText");
      const bubbleType = document.getElementById("bubbleType");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomInBtn = document.getElementById("zoomInBtn");
      const zoomResetBtn = document.getElementById("zoomResetBtn");
      const zoomLabel = document.getElementById("zoomLabel");

      const bubbleTypeOptions = Array.from(bubbleType.options).map(
        (option) => option.value,
      );

      const pages = [];
      let currentPageIndex = -1;
      let selectedIndex = -1;
      let zoomLevel = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let panStartX = 0;
      let panStartY = 0;

      const MIN_ZOOM = 0.4;
      const MAX_ZOOM = 3;
      const ZOOM_STEP = 0.2;
      const PAN_STEP = 80;

      const getBaseName = (filename) => filename.replace(/\.[^/.]+$/, "");

      const getCurrentPage = () => pages[currentPageIndex] ?? null;

      const getCurrentJson = () => getCurrentPage()?.jsonData ?? null;

      const getPageStatusTags = (page) => {
        const tags = [];
        if (page.imageName) tags.push("Image");
        if (page.jsonData) tags.push("JSON");
        return tags.length ? tags : ["Empty"];
      };

      const updateStatus = () => {
        const bubbleCount = getCurrentJson()?.items?.length ?? 0;
        const parts = [];
        if (pages.length) {
          parts.push(`Pages: ${pages.length}`);
        }
        if (currentPageIndex >= 0) {
          const page = getCurrentPage();
          parts.push(`Page ${currentPageIndex + 1}`);
          if (page?.imageName) {
            parts.push(`Image: ${page.imageName}`);
          }
          if (page?.jsonName) {
            parts.push(`JSON: ${page.jsonName}`);
          }
        }
        if (bubbleCount) {
          parts.push(`Bubbles: ${bubbleCount}`);
        }
        statusText.textContent = parts.length
          ? parts.join(" | ")
          : "No image or JSON loaded.";
        downloadBtn.disabled = !getCurrentJson();
        downloadAllBtn.disabled = !pages.some((page) => page.jsonData);
      };

      const setError = (message) => {
        errorText.textContent = message || "";
      };

      const getMaxPanX = () => {
        const wrapperWidth = imageWrapper.clientWidth;
        const imageWidth = mainImage.clientWidth;
        if (!wrapperWidth || !imageWidth) return 0;
        const scaledWidth = imageWidth * zoomLevel;
        return Math.max(0, (scaledWidth - wrapperWidth) / 2);
      };

      const getMaxPanY = () => {
        const wrapperHeight = imageWrapper.clientHeight;
        const imageHeight = mainImage.clientHeight;
        if (!wrapperHeight || !imageHeight) return 0;
        const scaledHeight = imageHeight * zoomLevel;
        return Math.max(0, (scaledHeight - wrapperHeight) / 2);
      };

      const clampPanX = (value) => {
        const maxPan = getMaxPanX();
        return Math.min(maxPan, Math.max(-maxPan, value));
      };

      const clampPanY = (value) => {
        const maxPan = getMaxPanY();
        return Math.min(maxPan, Math.max(-maxPan, value));
      };

      const updateTransform = () => {
        imageStage.style.transform = `translate(${panX / zoomLevel}px, ${panY / zoomLevel}px) scale(${zoomLevel})`;
      };

      const updateGrabState = () => {
        const canPan = getMaxPanX() > 0.5 || getMaxPanY() > 0.5;
        imageWrapper.classList.toggle("grabbable", canPan);
        if (!canPan) {
          panX = 0;
          panY = 0;
          updateTransform();
        } else {
          panX = clampPanX(panX);
          panY = clampPanY(panY);
          updateTransform();
        }
      };

      const applyZoom = (level) => {
        zoomLevel = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, level));
        panX = clampPanX(panX);
        panY = clampPanY(panY);
        updateTransform();
        zoomLabel.textContent = `${Math.round(zoomLevel * 100)}%`;
        zoomOutBtn.disabled = zoomLevel <= MIN_ZOOM + 0.001;
        zoomInBtn.disabled = zoomLevel >= MAX_ZOOM - 0.001;
        zoomResetBtn.disabled = Math.abs(zoomLevel - 1) < 0.001;
        updateGrabState();
      };

      const resetSelection = () => {
        selectedIndex = -1;
        detailForm.hidden = true;
        detailPlaceholder.hidden = false;
        bubbleId.value = "";
        bubbleOriginal.value = "";
        bubbleText.value = "";
        bubbleType.value = "Standard";
      };

      const clearOverlays = () => {
        overlayLayer.innerHTML = "";
      };

      const normalizeItem = (item) => {
        if (!item) return;
        if (typeof item.text !== "string") {
          item.text = "";
        }
        if (!bubbleTypeOptions.includes(item.bubble_type)) {
          item.bubble_type = "Standard";
        }
      };

      const validateJsonStructure = (data) => {
        if (!data || typeof data !== "object") {
          return "JSON is not an object.";
        }
        if (
          !data.image_size ||
          typeof data.image_size.width !== "number" ||
          typeof data.image_size.height !== "number"
        ) {
          return "JSON image_size is missing width/height numbers.";
        }
        if (!Array.isArray(data.items)) {
          return "JSON items must be an array.";
        }
        return "";
      };

      const renderPageList = () => {
        pageList.innerHTML = "";
        if (!pages.length) {
          pageList.innerHTML =
            '<div class="placeholder" style="padding: 12px;">No pages loaded.</div>';
          return;
        }
        pages.forEach((page, index) => {
          const button = document.createElement("button");
          button.type = "button";
          const name = page.imageName || page.jsonName || `Page ${index + 1}`;
          const tags = getPageStatusTags(page)
            .map((tag) => `<span>${tag}</span>`)
            .join("");
          button.innerHTML = `<div>${name}</div><div class="page-meta">${tags}</div>`;
          button.addEventListener("click", () => setCurrentPage(index));
          if (index === currentPageIndex) {
            button.classList.add("active");
          }
          pageList.appendChild(button);
        });
      };

      const renderBubbleList = () => {
        bubbleList.innerHTML = "";
        const jsonData = getCurrentJson();
        if (!jsonData?.items?.length) {
          bubbleList.innerHTML =
            '<div class="placeholder" style="padding: 12px;">No bubbles loaded.</div>';
          return;
        }
        jsonData.items.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = `#${item.id ?? index + 1}`;
          button.addEventListener("click", () => selectBubble(index));
          if (index === selectedIndex) {
            button.classList.add("active");
          }
          bubbleList.appendChild(button);
        });
      };

      const renderOverlays = () => {
        clearOverlays();
        const jsonData = getCurrentJson();
        if (!jsonData || !mainImage.src) return;

        const displayedWidth = mainImage.clientWidth;
        const displayedHeight = mainImage.clientHeight;
        overlayLayer.style.width = `${displayedWidth}px`;
        overlayLayer.style.height = `${displayedHeight}px`;

        const widthScale = displayedWidth / jsonData.image_size.width;
        const heightScale = displayedHeight / jsonData.image_size.height;

        jsonData.items.forEach((item, index) => {
          const bbox = item.bbox_bubble ?? item.bbox_text;
          if (!bbox) return;
          const left = bbox.x_min * widthScale;
          const top = bbox.y_min * heightScale;
          const width = (bbox.x_max - bbox.x_min) * widthScale;
          const height = (bbox.y_max - bbox.y_min) * heightScale;
          const overlay = document.createElement("div");
          overlay.className = "bubble-overlay";
          overlay.style.left = `${left}px`;
          overlay.style.top = `${top}px`;
          overlay.style.width = `${width}px`;
          overlay.style.height = `${height}px`;
          overlay.addEventListener("click", () => selectBubble(index));
          if (index === selectedIndex) {
            overlay.classList.add("active");
          }
          overlayLayer.appendChild(overlay);
        });
      };

      const selectBubble = (index) => {
        const jsonData = getCurrentJson();
        if (!jsonData?.items?.length) return;
        const clamped = Math.max(0, Math.min(index, jsonData.items.length - 1));
        selectedIndex = clamped;
        const item = jsonData.items[clamped];
        normalizeItem(item);
        bubbleId.value = item.id ?? clamped + 1;
        bubbleOriginal.value = item.text_original ?? "";
        bubbleText.value = item.text ?? "";
        bubbleType.value = item.bubble_type;
        detailPlaceholder.hidden = true;
        detailForm.hidden = false;
        renderBubbleList();
        renderOverlays();
      };

      bubbleText.addEventListener("input", (event) => {
        const jsonData = getCurrentJson();
        if (selectedIndex < 0 || !jsonData) return;
        jsonData.items[selectedIndex].text = event.target.value;
      });

      bubbleType.addEventListener("change", (event) => {
        const jsonData = getCurrentJson();
        if (selectedIndex < 0 || !jsonData) return;
        jsonData.items[selectedIndex].bubble_type = event.target.value;
      });

      const setCurrentPage = (index) => {
        if (index < 0 || index >= pages.length) return;
        currentPageIndex = index;
        const page = getCurrentPage();
        if (page?.imageUrl) {
          mainImage.src = page.imageUrl;
          imagePlaceholder.style.display = "none";
          imageStage.style.display = "inline-flex";
          mainImage.style.display = "block";
        } else {
          mainImage.removeAttribute("src");
          imagePlaceholder.style.display = "block";
          imageStage.style.display = "none";
          mainImage.style.display = "none";
        }
        mainImage.onload = () => {
          renderOverlays();
          updateGrabState();
        };
        panX = 0;
        panY = 0;
        applyZoom(1);
        resetSelection();
        renderPageList();
        renderBubbleList();
        renderOverlays();
        updateStatus();
      };

      const findPageByBaseName = (baseName) =>
        pages.find((page) => page.baseName === baseName);

      imageInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        files.forEach((file, index) => {
          const baseName = getBaseName(file.name);
          const existing = findPageByBaseName(baseName);
          const imageUrl = URL.createObjectURL(file);
          if (existing) {
            existing.imageFile = file;
            existing.imageUrl = imageUrl;
            existing.imageName = file.name;
          } else {
            pages.push({
              id: crypto.randomUUID(),
              baseName,
              imageFile: file,
              imageUrl,
              imageName: file.name,
              jsonData: null,
              jsonName: "",
            });
          }
          if (currentPageIndex === -1 && index === 0) {
            currentPageIndex = 0;
          }
        });
        setError("");
        renderPageList();
        if (currentPageIndex === -1 && pages.length) {
          setCurrentPage(0);
        } else if (currentPageIndex >= 0) {
          setCurrentPage(currentPageIndex);
        }
        updateStatus();
      });

      jsonInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        let errorMessage = "";
        const readers = files.map(
          (file) =>
            new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ file, content: reader.result });
              reader.readAsText(file);
            }),
        );
        Promise.all(readers).then((results) => {
          results.forEach(({ file, content }) => {
            try {
              const data = JSON.parse(content);
              const error = validateJsonStructure(data);
              if (error) {
                errorMessage = errorMessage
                  ? `${errorMessage} ${file.name}: ${error}`
                  : `${file.name}: ${error}`;
                return;
              }
              data.items.forEach((item) => normalizeItem(item));
              const baseName = getBaseName(file.name);
              const existing = findPageByBaseName(baseName);
              if (existing) {
                existing.jsonData = data;
                existing.jsonName = file.name;
              } else {
                pages.push({
                  id: crypto.randomUUID(),
                  baseName,
                  imageFile: null,
                  imageUrl: "",
                  imageName: "",
                  jsonData: data,
                  jsonName: file.name,
                });
              }
            } catch (err) {
              errorMessage = errorMessage
                ? `${errorMessage} ${file.name}: Invalid JSON file.`
                : `${file.name}: Invalid JSON file.`;
            }
          });
          setError(errorMessage);
          renderPageList();
          if (currentPageIndex === -1 && pages.length) {
            setCurrentPage(0);
          } else if (currentPageIndex >= 0) {
            setCurrentPage(currentPageIndex);
          }
          updateStatus();
        });
      });

      const getDownloadName = (page) => {
        if (page.jsonName) {
          return page.jsonName;
        }
        if (page.imageName) {
          return `${getBaseName(page.imageName)}.json`;
        }
        return "translated-bubbles.json";
      };

      const downloadJson = () => {
        const page = getCurrentPage();
        if (!page?.jsonData) return;
        const jsonData = page.jsonData;
        const blob = new Blob([JSON.stringify(jsonData, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = getDownloadName(page);
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };

      const downloadAllJson = () => {
        pages.forEach((page) => {
          if (!page.jsonData) return;
          const blob = new Blob([JSON.stringify(page.jsonData, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = getDownloadName(page);
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        });
      };

      downloadBtn.addEventListener("click", downloadJson);
      downloadAllBtn.addEventListener("click", downloadAllJson);

      zoomOutBtn.addEventListener("click", () => {
        applyZoom(zoomLevel - ZOOM_STEP);
      });

      zoomInBtn.addEventListener("click", () => {
        applyZoom(zoomLevel + ZOOM_STEP);
      });

      zoomResetBtn.addEventListener("click", () => {
        applyZoom(1);
      });

      window.addEventListener("resize", () => {
        renderOverlays();
        updateGrabState();
      });

      imageWrapper.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        if (event.target.closest(".bubble-overlay")) return;
        if (getMaxPanX() <= 0.5 && getMaxPanY() <= 0.5) return;
        isDragging = true;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        panStartX = panX;
        panStartY = panY;
        imageWrapper.classList.add("grabbing");
        imageWrapper.setPointerCapture(event.pointerId);
      });

      imageWrapper.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        const deltaX = event.clientX - dragStartX;
        const deltaY = event.clientY - dragStartY;
        panX = clampPanX(panStartX + deltaX);
        panY = clampPanY(panStartY + deltaY);
        updateTransform();
      });

      const stopDragging = () => {
        if (!isDragging) return;
        isDragging = false;
        imageWrapper.classList.remove("grabbing");
      };

      imageWrapper.addEventListener("pointerup", stopDragging);
      imageWrapper.addEventListener("pointercancel", stopDragging);
      imageWrapper.addEventListener("pointerleave", stopDragging);

      const panBy = (deltaX, deltaY) => {
        if (getMaxPanX() <= 0.5 && getMaxPanY() <= 0.5) return;
        panX = clampPanX(panX + deltaX);
        panY = clampPanY(panY + deltaY);
        updateTransform();
      };

      const isTypingTarget = (eventTarget) => {
        if (!(eventTarget instanceof Element)) return false;
        return (
          eventTarget.closest(
            "input, textarea, select, [contenteditable='true']",
          ) !== null
        );
      };

      document.addEventListener("keydown", (event) => {
        if (isTypingTarget(event.target)) return;
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "s"
        ) {
          event.preventDefault();
          downloadJson();
          return;
        }
        if (!event.ctrlKey && !event.metaKey) {
          if (event.key === "+" || event.key === "=") {
            event.preventDefault();
            applyZoom(zoomLevel + ZOOM_STEP);
            return;
          }
          if (event.key === "-") {
            event.preventDefault();
            applyZoom(zoomLevel - ZOOM_STEP);
            return;
          }
          if (event.key === "0") {
            event.preventDefault();
            panX = 0;
            panY = 0;
            applyZoom(1);
            return;
          }
          if (event.shiftKey && event.key === "ArrowLeft") {
            event.preventDefault();
            panBy(-PAN_STEP, 0);
            return;
          }
          if (event.shiftKey && event.key === "ArrowRight") {
            event.preventDefault();
            panBy(PAN_STEP, 0);
            return;
          }
          if (event.shiftKey && event.key === "ArrowUp") {
            event.preventDefault();
            panBy(0, -PAN_STEP);
            return;
          }
          if (event.shiftKey && event.key === "ArrowDown") {
            event.preventDefault();
            panBy(0, PAN_STEP);
            return;
          }
        }
        const jsonData = getCurrentJson();
        if (!jsonData?.items?.length) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          selectBubble(selectedIndex + 1);
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          selectBubble(selectedIndex - 1);
        }
      });

      // How to run locally:
      // 1) Save this file as index.html.
      // 2) Open index.html in your browser.
      renderPageList();
      applyZoom(1);
      updateStatus();
    </script>
  </body>
</html>
